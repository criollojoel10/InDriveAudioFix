name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: ⚙️ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Grant permission
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: InDriveAudioFix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: 🏷️ Extract version
        id: get_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: "InDriveAudioFix v${{ steps.get_version.outputs.version }}"
          body: |
            ## 📱 InDriveAudioFix v${{ steps.get_version.outputs.version }}

            ### Cambios
            Ver [CHANGELOG.md](CHANGELOG.md) para detalles completos.

            ### 📲 Instalación
            1. Descarga el APK
            2. Instálalo en tu dispositivo
            3. Activa el módulo en **LSPosed**
            4. Selecciona **inDrive** (`sinet.startup.inDriver`) como app objetivo
            5. Reinicia inDrive o el dispositivo

            ### 🐛 Reportar issues
            https://github.com/criollojoel10/InDriveAudioFix/issues
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
